name: sniff

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      secrets:
        - web_env
        - server_env
    init: true
    ports:
      - "3000:3000"
    env_file:
      - path: apps/server/.env
        required: false
    environment:
      DATABASE_URL: file:/data/local.db
      MASTRA_DATABASE_URL: file:/data/mastra.db
      DETECTOR_URL: http://detector:7860
    depends_on:
      - detector
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - type: bind
        source: ./.data
        target: /data
        bind:
          create_host_path: false
    restart: unless-stopped

  detector:
    build:
      context: apps/detector
    init: true
    env_file:
      - path: apps/detector/.env
        required: false
    environment:
      AI_DETECTOR_CACHE: /models
    volumes:
      # Reuses the models already downloaded for local dev.
      - type: bind
        source: ./apps/detector/data/models
        target: /models
    restart: unless-stopped

# BuildKit makes these available only while install/build commands run.
secrets:
  web_env:
    file: apps/web/.env
  server_env:
    file: apps/server/.env
