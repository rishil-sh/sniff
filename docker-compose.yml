# docker compose up   → web http://localhost:3001, API http://localhost:3000
# Works with no configuration. Optional settings (Muse key, WhatsApp, Llama pair) go in a root .env; see .env.example.
# Public HTTPS on your own domain: set SNIFF_DOMAIN + PUBLIC_*_URL in .env, then `docker compose --profile public up`.
name: sniff

x-detector: &detector
  build: apps/detector
  image: sniff-detector:local
  environment:
    AI_DETECTOR_TEXT_PAIR: ${AI_DETECTOR_TEXT_PAIR:-0}
    AI_DETECTOR_TEXT_OBSERVER: ${AI_DETECTOR_TEXT_OBSERVER:-mlx-community/Llama-3.2-3B-bf16}
    AI_DETECTOR_TEXT_PERFORMER: ${AI_DETECTOR_TEXT_PERFORMER:-mlx-community/Llama-3.2-3B-Instruct}
    HF_TOKEN: ${HF_TOKEN:-}
  volumes:
    - models:/models

services:
  # Only with `--profile public`. HTTPS with automatic Let's Encrypt certs; routes come from the `caddy` labels below.
  caddy:
    image: lucaslorentz/caddy-docker-proxy:2.13.1-alpine
    profiles: [public]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CADDY_INGRESS_NETWORKS: sniff
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - caddy:/data
    restart: unless-stopped

  # One-shot: downloads every model into the `models` volume (~10 GB; ~23 GB with the Llama pair), then exits.
  # Later starts find the files cached and finish in seconds.
  models:
    <<: *detector
    command: ["ai-detector-download"]
    restart: "no"

  detector:
    <<: *detector
    depends_on:
      models:
        condition: service_completed_successfully
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: sniff-server:local
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:/data/sniff.db
      MASTRA_DATABASE_URL: file:/data/mastra.db
      DETECTOR_URL: http://detector:7860
      BETTER_AUTH_URL: ${PUBLIC_SERVER_URL:-http://localhost:3000}
      CORS_ORIGIN: ${PUBLIC_WEB_URL:-http://localhost:3001}
      # Generated and stored in the data volume when empty (see apps/server/docker-entrypoint.sh).
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MUSE_MODEL: ${MUSE_MODEL:-muse-wonder-1.0}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
    volumes:
      - data:/data
    labels:
      caddy: api.${SNIFF_DOMAIN:-localhost}
      caddy.reverse_proxy: "{{upstreams 3000}}"
    depends_on:
      detector:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SERVER_URL: ${PUBLIC_SERVER_URL:-http://localhost:3000}
    image: sniff-web:local
    ports:
      - "3001:3001"
    environment:
      SERVER_URL: http://server:3000
    labels:
      caddy: ${SNIFF_DOMAIN:-localhost}
      caddy.reverse_proxy: "{{upstreams 3001}}"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  models:
  data:
  caddy:

networks:
  default:
    name: sniff
