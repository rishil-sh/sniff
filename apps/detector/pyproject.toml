[project]
name = "ai-detector"
version = "0.1.0"
description = "Open-source evidence-first detector for AI-generated image, video, audio, and text"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "openai>=1.55",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "c2pa-python==0.38.2",
    "pillow>=10.0",
    "defusedxml>=0.7",
    "torch>=2.4",
    "torchvision>=0.19",
    "timm>=0.9.16",
    "huggingface-hub>=0.23",
    "safetensors>=0.4",
    "open-clip-torch>=2.24",
    "invisible-watermark>=0.2.0",
    "transformers>=4.45",
    "einops>=0.8",
    "torchaudio>=2.11.1",
    "audioseal>=0.1.4",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
deploy = ["modal>=0.73"]

[project.scripts]
ai-detector = "ai_detector.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_detector"]

[tool.hatch.build.targets.wheel.force-include]
"ai_detector/fusion.yaml" = "ai_detector/fusion.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
