# Documented fusion weights, Platt fits and stackers (2026-11-03). Learned p_ai values without a platt:
# entry are raw sigmoids. img.head is a logistic head on frozen commfor
# features, trained on data/eval_v2 (zr-zhang originals, FFHQ real faces, FLUX AI portraits,
# plus a phone-screenshot copy of each) with a false positive costing 2x a miss:
# scripts/train_head.py (git history, bde0082) --commfor-only --real-weight 2 --l2 3. Its score is the vote.
version: "0.6"
# 2-fold held-out at 0.85: real flagged 0/1717 (517 originals, 600 screenshots, 300 faces,
# 300 face screenshots; highest real 0.82); AI caught 729/1800 (FLUX portraits 467/600 is
# optimistic: one generator, little prompt variety). Old policy at 0.90: 30/1717 real flagged.
bands:
  no_ai_signal_below: 0.50
  likely_ai_above: 0.85
max_disagreement: 0.8
# Learned scores with |p_ai - 0.5| below this do not vote.
chance_band: 0.15
weights:
  img.head: 1
  img.commfor: 0 # flags zoomed screenshots of real photos (29/900 at 0.90); shown, does not vote
  img.clip: 0 # AUROC 0.56 on eval_v2 (0.66 on eval): near chance, shown, does not vote
  img.spai: 0 # AUROC 0.69 and got weight 0 in both held-out folds: shown, does not vote
  # Text weights only apply when the text stacker below can't run (a classifier failed or its version changed).
  # The zero-shot Llama pair is shown but does not vote: the 3B pair flagged 0/5 modern essays (2026-11-03).
  txt.binoculars: 0
  txt.fastdetect: 0
  txt.fakespot: 0.5
  txt.desklib: 0.5
  txt.head: 0 # decides through stackers.text
  # Audio (English), from scripts/eval_audio.py on the audio-detection branch, 2026-11-03 (docs/audio-detection.md):
  # the w2v-BERT probe decides. DF Arena (37% false positives on Common Voice humans) and MamBo
  # (17-37%) stay in the report as evidence with no vote; weight 0 also removes their disagreement veto.
  aud.w2vbert: 1.0
  aud.dfarena: 0.0
  aud.mambo: 0.0
  # Video: frame-aggregated image head (detectors/video.py). Soundtrack aud.* scores are shown but never vote on a
  # video (fusion.py weight_of): music, effects and non-English speech are outside the probe's English-speech set.
  vid.head: 1
# Per-detector Platt fits from scripts/eval_images.py. Empty = raw sigmoids.
# Fit on all of eval_v2; held-out fold fits (tune_fusion.py) land within a=0.40-0.45, b=2.3-2.7.
platt:
  img.commfor:
    {
      a: 0.424375,
      b: 2.54619,
      set: eval_v2,
      auroc: 0.8981,
      tpr_at_1pct_fpr: 0.2142,
    }
  img.clip:
    {
      a: 0.144587,
      b: -0.197498,
      set: eval_v2,
      auroc: 0.5574,
      tpr_at_1pct_fpr: 0.0042,
    }
  # spai not rescored on eval_v2 (--skip-spai); fit is from data/eval
  img.spai:
    {
      a: 0.0295695,
      b: 0.515644,
      set: eval,
      auroc: 0.6917,
      tpr_at_1pct_fpr: 0.0563,
    }
  # Llama-3.2-3B pair on 73 unattacked RAID abstracts, in-sample. Refit when you change the pair.
  txt.binoculars:
    {
      a: -20.9382,
      b: 16.7992,
      set: raid-abstracts-73@Llama-3.2-3B,
      auroc: 1.0,
      tpr_at_1pct_fpr: 1.0,
    }
  txt.fastdetect:
    {
      a: 1.3822,
      b: -4.16124,
      set: raid-abstracts-73@Llama-3.2-3B,
      auroc: 1.0,
      tpr_at_1pct_fpr: 1.0,
    }
  # data/eval_text (scripts/fetch_text_eval.py), fit on 1,027 rows, measured on the other 1,056.
  txt.fakespot:
    {
      a: 0.79406,
      b: -4.444005,
      set: eval_text-fit1027,
      auroc: 0.9933,
      tpr_at_1pct_fpr: 0.906,
    }
  txt.desklib:
    {
      a: 0.715916,
      b: -2.617667,
      set: eval_text-fit1027,
      auroc: 0.99,
      tpr_at_1pct_fpr: 0.9312,
    }
# Logistic stackers over raw detector scores; they replace the weighted mean and disagreement veto for a modality.
stackers:
  # Text head (detectors/text.py HEAD_PATH, scripts/train_text_head.py, 2026-11-05): a logistic layer over both
  # classifiers' pooled features, trained on random 40-450 word crops of 1,260 Muse texts, PAN'25 train (22
  # generators) and MAGE train (27 generators, human Reddit/Yelp/stories/news). Replaces the 2-logit stacker, which
  # called 58% of Muse text human. Independent benchmark (HC3, MAGE GPT-4 OOD, PAN'25 val, unseen Muse prompt types;
  # 2,117 cuts; old -> new):
  #   AI called likely_ai     150w 82.6% -> 93.0%   250w 86.3% -> 95.6%   100w (newly accepted) 87%
  #   AI called no_ai_signal  150w 10.7% ->  4.1%   250w 10.4% ->  3.3%   100w 4.1%
  #   humans called likely_ai 150w  1.0% ->  1.0%   250w  4.1% ->  1.4%   100w 1.6%
  #   Muse caught             21-41% -> 94-100% at 70-250 words
  # Bands from the validation split only: likely_ai_above = 2% of human texts over it, no_ai_signal_below = 3% of AI
  # texts under it (>= 85 words). Under 150 tokens the 99th/3rd percentiles of 80-135 word texts apply instead.
  # Not measured: casual human chat (WhatsApp-style); the human sets are essays, news, Q&A, reviews, Reddit, stories.
  text:
    intercept: 0
    coef: { txt.head: 1.0 }
    versions: { txt.head: text-head@muse-pan-mage-v1 }
    bands: { no_ai_signal_below: 0.46, likely_ai_above: 0.659 }
    short_bands:
      { below_tokens: 150, no_ai_signal_below: 0.357, likely_ai_above: 0.851 }
    set: text-head-val
  # Learned 2026-11-04 by a leave-one-vendor-out logistic stacker over the three speech detectors on 610
  # training clips (ElevenLabs, OpenAI, MMS, Piper, macOS vs Common Voice + LibriSpeech; probe scores out of fold).
  # Held-out worst-vendor recall at 1% human FPR: probe 0.89, probe+DF Arena 0.88, +MamBo 0.86, all three 0.83,
  # DF Arena+MamBo 0.16; MamBo's weight came out ~0. So the mixture is the probe alone, recalibrated: that
  # calibration (logit*1.3455+3.2610) is folded into the probe weights (tag en-L18-C0.01-cal1), so its p_ai and
  # timeline are calibrated and this stacker passes it through with its own bands. Bands, out of fold:
  # likely_ai_above = 1% of human clips, no_ai_signal_below = 2% of AI clips under it.
  # Test (422 clips, docs/audio-detection.md): humans called likely_ai 0/90 (4 LibriSpeech inconclusive),
  # Gemini likely_ai 51 -> 78/80, OpenAI tts-1 0 -> 3/6, ElevenLabs 119/119.
  audio:
    intercept: 0.0
    coef: { aud.w2vbert: 1.0 }
    versions:
      { aud.w2vbert: "facebook/w2v-bert-2.0@da985ba+probe:en-L18-C0.01-cal1" }
    bands: { no_ai_signal_below: 0.4193, likely_ai_above: 0.8954 }
    target_fpr: 0.01
    set: probe_train-610-logo
  # Video: pass-through of vid.head with its own bands. Measured 2026-11-04 on 4 Kling clips and 4 real clips:
  # Kling originals 0.58-0.82, the same clips re-encoded to 360-480p 0.13-0.34, real clips 0.31-0.46. A low frame
  # score is no evidence of a real video, so the head can say likely_ai but never no_ai_signal on a video.
  video:
    intercept: 0.0
    coef: { vid.head: 1.0 }
    bands: { no_ai_signal_below: 0.0, likely_ai_above: 0.85 }
    set: kling-4+real-4 (2026-11-04)
